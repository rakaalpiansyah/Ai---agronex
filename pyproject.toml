[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-crop-recommender"
version = "1.0.0"
description = "Production-grade AI Engineering system recommending optimal crops and precision cultivation strategies based on IoT telemetry and FAO EcoCrop."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AI Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "shap>=0.45.0",
    "pyarrow>=15.0.0",
    "joblib>=1.3.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
